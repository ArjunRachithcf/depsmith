[workspace]
members = ["crates/core", "crates/cli", "crates/python"]
default-members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[workspace.lints.rust]
# Public items document themselves; clippy -D warnings turns gaps into errors.
missing_docs = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
