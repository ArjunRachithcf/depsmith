[workspace]
members = ["crates/core", "crates/cli", "crates/python"]
default-members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0-rc.2"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/ArjunRachithcf/depsmith"
homepage = "https://github.com/ArjunRachithcf/depsmith/wiki"
keywords = ["dependencies", "lockfile", "update", "vulnerability", "uv"]
categories = ["development-tools", "command-line-utilities"]

[workspace.lints.rust]
# Public items document themselves; clippy -D warnings turns gaps into errors.
missing_docs = "warn"

[workspace.dependencies]
# Internal crates: the version must equal workspace.package.version (checked
# by the Release workflow) so the published crates depend on each other.
depsmith-core = { path = "crates/core", version = "0.1.0-rc.2" }
depsmith = { path = "crates/cli", version = "0.1.0-rc.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
