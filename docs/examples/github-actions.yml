# Copy into the consuming repository's .github/workflows/ after depsmith is published.
name: Dependency check
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install depsmith==0.1.0
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.80.0
          run-install: false
      - name: Check dependencies
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          depsmith check --all --non-interactive --json > "$RUNNER_TEMP/depsmith.json"
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            echo 'Dependency updates are available.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-report
          path: ${{ runner.temp }}/depsmith.json
          if-no-files-found: warn
