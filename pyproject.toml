[build-system]
requires = ["maturin>=1.9.3,<2"]
build-backend = "maturin"

[project]
name = "depsmith"
version = "0.1.0"
description = "Review and apply dependency updates with a shared Rust CLI and Python API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Rust", "Programming Language :: Python :: 3", "Typing :: Typed"]

[project.urls]
Repository = "https://github.com/ArjunRachithcf/depsmith"
Issues = "https://github.com/ArjunRachithcf/depsmith/issues"

[project.scripts]
depsmith = "depsmith.cli:main"

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
python-source = "python"
module-name = "depsmith._native"
features = ["pyo3/extension-module"]
include = [{ path = "LICENSE", format = "sdist" }, { path = "tests/python/*.py", format = "sdist" }]

[tool.ruff.lint]
# Docstrings are required on the public Python API (Google style).
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
