# Native integration: real Pixi, uv, npm, Grype, cargo and conda-lock plus conda-forge,
# pypi.org, crates.io and the GitHub API. Informational on pull requests;
# blocking as a gate in the Release workflow. Nightly failures open or update
# a tracking issue (integration-alert.yml). Tool versions come from
# .github/tool-versions.json, which must equal the adapters' tested versions
# (checked by a test); the Latest tools workflow calls this one with
# `latest-tool` and `latest-version` to run one tool at a newer release.
name: Integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      latest-tool:
        description: Tool to run at latest-version instead of its pin (pixi, uv, grype, conda-lock, conda)
        type: string
        default: ''
      latest-version:
        description: Version of latest-tool to run
        type: string
        default: ''
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tests: --workspace
            python: true
          - os: windows-latest
            tests: -p depsmith-core --test pixi_live --test uv_live --test npm_live
            python: false
          - os: macos-latest
            tests: -p depsmith-core --test pixi_live --test uv_live --test npm_live
            python: false
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Resolve tool versions
        shell: bash
        env:
          LATEST_TOOL: ${{ inputs.latest-tool }}
          LATEST_VERSION: ${{ inputs.latest-version }}
        run: |
          version() {
            if [ "$LATEST_TOOL" = "$1" ]; then echo "$LATEST_VERSION"
            else python -c 'import json, sys; print(json.load(open(".github/tool-versions.json"))[sys.argv[1]])' "$1"; fi
          }
          {
            echo "PIXI_VERSION=v$(version pixi)"
            echo "UV_VERSION=$(version uv)"
            echo "GRYPE_VERSION=$(version grype)"
            echo "CONDA_LOCK_VERSION=$(version conda-lock)"
            echo "MICROMAMBA_VERSION=$(version conda)"
            echo "NODE_VERSION=$(version node)"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          run-install: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Grype (checksum-verified)
        if: runner.os == 'Linux'
        run: |
          base="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/grype_${GRYPE_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "grype_${GRYPE_VERSION}_checksums.txt"
          tar -xzf "grype_${GRYPE_VERSION}_linux_amd64.tar.gz" grype
          echo "GRYPE=$RUNNER_TEMP/grype" >> "$GITHUB_ENV"
      - name: Install conda-lock and micromamba
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pixi global install "conda-lock==${CONDA_LOCK_VERSION}" "micromamba==${MICROMAMBA_VERSION}"
          echo "CONDA_LOCK=$(command -v conda-lock)" >> "$GITHUB_ENV"
          echo "CONDA_SOLVER=$(command -v micromamba)" >> "$GITHUB_ENV"
      - name: Native Rust tests (one retry for network flakes)
        shell: bash
        run: |
          PIXI="$(command -v pixi)"
          UV="$(command -v uv)"
          # Git Bash finds npm's extensionless shell shim; native processes need npm.cmd.
          if [ "$RUNNER_OS" = Windows ]; then NPM="$(command -v npm.cmd)"; else NPM="$(command -v npm)"; fi
          export PIXI UV NPM
          run() { cargo test ${{ matrix.tests }} --locked -- --ignored --test-threads 1; }
          if ! run; then
            echo "::warning::Native tests failed; retrying once to rule out a transient network error"
            run
          fi
      - name: Native Python test (one retry)
        if: matrix.python
        shell: bash
        run: |
          PIXI="$(command -v pixi)"
          export PIXI
          python -m pip install .
          run() { python -m unittest discover -s tests/python -v; }
          if ! run; then
            echo "::warning::Python tests failed; retrying once"
            run
          fi
      - name: Record the result for the Latest tools report
        if: always() && inputs.latest-tool != ''
        shell: bash
        env:
          STATUS: ${{ job.status }}
          LATEST_TOOL: ${{ inputs.latest-tool }}
          LATEST_VERSION: ${{ inputs.latest-version }}
        run: |
          mkdir -p latest-result
          echo "$STATUS $LATEST_VERSION" > "latest-result/$LATEST_TOOL-$RUNNER_OS"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.latest-tool != ''
        with:
          name: latest-${{ inputs.latest-tool }}-${{ runner.os }}
          path: latest-result/
