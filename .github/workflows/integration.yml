# Native integration: real Pixi, uv, Grype, cargo and conda-lock plus conda-forge,
# pypi.org, crates.io and the GitHub API. Informational on pull requests;
# blocking as a gate in the Release workflow. Nightly failures open or update
# a tracking issue (integration-alert.yml). The Latest tools workflow calls it
# with `latest-tool` to run one tool at its newest release, others pinned; the
# pins below must equal the adapters' tested versions (checked by a test).
name: Integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      latest-tool:
        description: Tool to run at its latest release (pixi, uv, grype, conda-lock, conda)
        type: string
        default: ''
permissions:
  contents: read
env:
  PIXI_VERSION: ${{ inputs.latest-tool == 'pixi' && 'latest' || 'v0.80.0' }}
  GRYPE_VERSION: ${{ inputs.latest-tool == 'grype' && 'latest' || '0.119.0' }}
  UV_VERSION: ${{ inputs.latest-tool == 'uv' && 'latest' || '0.12.15' }}
  CONDA_LOCK_PIN: ${{ inputs.latest-tool != 'conda-lock' && '==4.0.2' || '' }}
  MICROMAMBA_PIN: ${{ inputs.latest-tool != 'conda' && '==2.9.0' || '' }}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tests: --workspace
            python: true
          - os: windows-latest
            tests: -p depsmith-core --test pixi_live --test uv_live
            python: false
          - os: macos-latest
            tests: -p depsmith-core --test pixi_live --test uv_live
            python: false
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          run-install: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install Grype (checksum-verified)
        if: runner.os == 'Linux'
        run: |
          if [ "$GRYPE_VERSION" = latest ]; then
            GRYPE_VERSION=$(gh release view --repo anchore/grype --json tagName --jq .tagName | sed 's/^v//')
          fi
          base="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/grype_${GRYPE_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "grype_${GRYPE_VERSION}_checksums.txt"
          tar -xzf "grype_${GRYPE_VERSION}_linux_amd64.tar.gz" grype
          echo "GRYPE=$RUNNER_TEMP/grype" >> "$GITHUB_ENV"
      - name: Install conda-lock and micromamba
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pixi global install "conda-lock${CONDA_LOCK_PIN}" "micromamba${MICROMAMBA_PIN}"
          echo "CONDA_LOCK=$(command -v conda-lock)" >> "$GITHUB_ENV"
          echo "CONDA_SOLVER=$(command -v micromamba)" >> "$GITHUB_ENV"
      - name: Native Rust tests (one retry for network flakes)
        shell: bash
        run: |
          PIXI="$(command -v pixi)"
          UV="$(command -v uv)"
          export PIXI UV
          run() { cargo test ${{ matrix.tests }} --locked -- --ignored --test-threads 1; }
          if ! run; then
            echo "::warning::Native tests failed; retrying once to rule out a transient network error"
            run
          fi
      - name: Native Python test (one retry)
        if: matrix.python
        shell: bash
        run: |
          PIXI="$(command -v pixi)"
          export PIXI
          python -m pip install .
          run() { python -m unittest discover -s tests/python -v; }
          if ! run; then
            echo "::warning::Python tests failed; retrying once"
            run
          fi
      - name: Record the result for the Latest tools report
        if: always() && inputs.latest-tool != ''
        shell: bash
        run: |
          mkdir -p latest-result
          echo "${{ job.status }}" > "latest-result/${{ inputs.latest-tool }}-${{ runner.os }}"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.latest-tool != ''
        with:
          name: latest-${{ inputs.latest-tool }}-${{ runner.os }}
          path: latest-result/
