# Rust and Python line coverage. Codecov tracks history and gates project/patch
# coverage (codecov.yml); this job independently fails below 75% combined, so the
# gate holds even if Codecov is unavailable. Separate from ci.yml because OIDC
# uploads need id-token: write, which the Release workflow's reusable call to
# ci.yml does not grant.
name: Coverage
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2.87.21
        with:
          tool: cargo-llvm-cov
      # One instrumented build covers both the Rust tests and the PyO3 extension
      # as exercised by the Python tests; llvm-cov merges all profiles. maturin
      # runs on the host so the instrumentation environment reaches the build.
      - name: Rust and Python tests under coverage
        run: |
          eval "$(cargo llvm-cov show-env --sh)"
          cargo llvm-cov clean --workspace
          cargo test --workspace --locked
          python -m pip install 'maturin>=1.9.3,<2' coverage
          maturin build --locked --out dist -i python
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', *glob.glob('dist/*.whl')])"
          python -m coverage run --source=depsmith -m unittest discover -s tests/python -v
          python -m coverage xml -o python-coverage.xml
          cargo llvm-cov report --cobertura --output-path rust-coverage.xml
      # Upload before the backstop so Codecov records coverage even when it fails.
      - uses: codecov/codecov-action@v7.1.1
        if: ${{ !cancelled() }}
        with:
          use_oidc: true
          files: rust-coverage.xml
          flags: rust
          disable_search: true
          fail_ci_if_error: false
      - uses: codecov/codecov-action@v7.1.1
        if: ${{ !cancelled() }}
        with:
          use_oidc: true
          files: python-coverage.xml
          flags: python
          disable_search: true
          fail_ci_if_error: false
      - name: Backstop gate (75% combined line coverage)
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          roots = [ET.parse(f).getroot() for f in ('rust-coverage.xml', 'python-coverage.xml')]
          covered = sum(int(r.get('lines-covered')) for r in roots)
          valid = sum(int(r.get('lines-valid')) for r in roots)
          lines = 100 * covered / valid
          print(f'Combined line coverage: {lines:.1f}%')
          if lines < 75:
              raise SystemExit(f'Line coverage {lines:.1f}% is below the required 75%')
          PY
