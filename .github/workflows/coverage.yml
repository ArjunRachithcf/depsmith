# Combined Rust and Python line coverage: a required check on pull requests (fails
# below 75%) and the README badge on main. Separate from ci.yml because the badge
# job needs contents: write, which the Release workflow's reusable call to ci.yml
# does not grant.
name: Coverage
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      lines: ${{ steps.total.outputs.lines }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2.87.21
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --cobertura --output-path rust-coverage.xml
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist -i python3.10
          manylinux: auto
      - name: Python tests under coverage.py
        run: |
          python -m pip install coverage
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', *glob.glob('dist/*.whl')])"
          python -m coverage run --source=depsmith -m unittest discover -s tests/python -v
          python -m coverage xml -o python-coverage.xml
      - name: Combined line coverage
        id: total
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          roots = [ET.parse(f).getroot() for f in ('rust-coverage.xml', 'python-coverage.xml')]
          covered = sum(int(r.get('lines-covered')) for r in roots)
          valid = sum(int(r.get('lines-valid')) for r in roots)
          lines = 100 * covered / valid
          print(f'lines={lines:.1f}')
          if lines < 75:
              raise SystemExit(f'Line coverage {lines:.1f}% is below the required 75%')
          PY
  # README badge data: on main only, publish a shields.io endpoint file to the
  # orphan `badges` branch (outside the main-branch ruleset).
  badge:
    if: github.event_name == 'push'
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish coverage badge data
        env:
          GH_TOKEN: ${{ github.token }}
          LINES: ${{ needs.coverage.outputs.lines }}
        run: |
          color=$(python3 -c "import os; v=float(os.environ['LINES']); print('brightgreen' if v >= 90 else 'green' if v >= 80 else 'yellow' if v >= 75 else 'red')")
          git init -q badges && cd badges
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin badges; then git checkout -q -b badges FETCH_HEAD; else git checkout -q --orphan badges; fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$LINES" "$color" > coverage.json
          git add coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898283+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Coverage ${LINES}% at ${GITHUB_SHA}"
          git push -q origin HEAD:badges
