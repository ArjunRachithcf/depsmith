# Coverage for the code-coverage ruleset: the main baseline plus each pull request.
# Separate from ci.yml because uploads need code-quality: write, which the Release
# workflow's reusable call to ci.yml does not grant.
name: Coverage
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2.87.21
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --cobertura --output-path rust-coverage.xml
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist -i python3.10
          manylinux: auto
      - name: Python tests under coverage.py
        run: |
          python -m pip install coverage
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', *glob.glob('dist/*.whl')])"
          python -m coverage run --source=depsmith -m unittest discover -s tests/python -v
          python -m coverage xml -o python-coverage.xml
      - uses: actions/upload-code-coverage@v1.4.3
        with:
          file: rust-coverage.xml
          language: Rust
          label: code-coverage/llvm-cov
      - uses: actions/upload-code-coverage@v1.4.3
        with:
          file: python-coverage.xml
          language: Python
          label: code-coverage/coverage-py
