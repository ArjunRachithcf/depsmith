# Weekly drift tracking for the native tools depsmith drives: Integration runs
# once per tool with only that tool at its latest release (others pinned), then
# scripts/tool-drift.py opens a pull request bumping each tool whose latest
# release passes (tested version, pinned downloads and Integration pin, as a
# GitHub-signed commit from the docs App so CI runs on it), and keeps one
# `latest-tools` issue per tool that its latest release breaks, whose pinned
# download's sha256 changed, or that cannot be bumped automatically.
name: Latest tools
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        tool: [pixi, uv, grype, conda-lock, conda]
    uses: ./.github/workflows/integration.yml
    with:
      ref: ${{ github.sha }}
      latest-tool: ${{ matrix.tool }}
  report:
    needs: integration
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          pattern: latest-*
          merge-multiple: true
          path: results
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
      - name: Report drift, open bump pull requests and sync issues
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISSUES_TOKEN: ${{ github.token }}
        run: |
          cargo run -q -p depsmith-cli --locked -- doctor --json > doctor.json
          python scripts/tool-drift.py doctor.json results --act | tee -a "$GITHUB_STEP_SUMMARY"
