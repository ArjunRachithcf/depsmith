name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, v{Cargo version} (for example v0.1.0 or v0.1.0-rc.2)
        required: true
        type: string
      publish:
        description: Publish to PyPI and create a draft GitHub release after validation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag and package versions
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, re, subprocess, tomllib
          # One version, the Cargo one: X.Y.Z or X.Y.Z-{alpha,beta,rc}.N, and
          # the tag is exactly v{it} (cargo-binstall downloads from there).
          # Python (maturin) derives its own from it; CI builds the conda
          # recipe from that sdist, and the feedstock follows PyPI.
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?', tag):
              raise SystemExit(f'Expected a tag such as v0.1.0 or v0.1.0-rc.2, got {tag}')
          sha = subprocess.check_output(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], text=True).strip()
          def show(path):
              return subprocess.check_output(['git', 'show', f'{sha}:{path}'], text=True)
          workspace = tomllib.loads(show('Cargo.toml'))['workspace']
          version = workspace['package']['version']
          if tag[1:] != version:
              raise SystemExit(f'Tag {tag} must be v{version} (the Cargo version)')
          internal = [workspace['dependencies'][name]['version'] for name in ('depsmith-core', 'depsmith')]
          if internal != [version] * 2:
              raise SystemExit(f'Internal crate dependencies {internal} disagree with {version}')
          project = tomllib.loads(show('pyproject.toml'))['project']
          if 'version' in project or 'version' not in project.get('dynamic', []):
              raise SystemExit('pyproject.toml must take its version from Cargo (dynamic = ["version"])')
          variants = subprocess.run(['git', 'show', f'{sha}:recipes/depsmith/variants.yaml'], capture_output=True, text=True).stdout
          if '-' not in version and 'channel_targets' in variants:
              raise SystemExit('A final release must not send conda packages to the rc label: remove recipes/depsmith/variants.yaml')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\n')
          PY
  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
  integration:
    needs: validate
    uses: ./.github/workflows/integration.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
  pypi:
    if: inputs.publish
    needs: [build, integration]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
  crates:
    if: inputs.publish
    needs: [validate, build, integration]
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      # crates.io trusted publishing: a short-lived token from this workflow's
      # OIDC identity. Trusted publishers can only be added to crates that
      # exist, so the first publish uses a CARGO_REGISTRY_TOKEN secret of the
      # `crates` environment instead (remove it afterwards).
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
        continue-on-error: true
      - name: Publish depsmith-core, then depsmith (skipping versions already published)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "depsmith") | .version')
          for crate in depsmith-core depsmith; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A 'depsmith-release (github.com/ArjunRachithcf/depsmith)' \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = 200 ]; then
              echo "$crate $version is already on crates.io; skipping"
            else
              cargo publish -p "$crate" --locked
            fi
          done
  github-release:
    if: inputs.publish
    needs: [validate, build, integration]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          path: source
      - name: Bundle standalone executables and install scripts
        run: |
          mkdir assets
          for directory in artifacts/cli-*; do
            name="${directory##*/}"
            chmod +x "$directory"/depsmith*
            tar -czf "assets/depsmith-${name#cli-}.tar.gz" -C "$directory" .
          done
          find artifacts -type f \( -name '*.whl' -o -name '*.conda' -o -name '*.tar.gz' \) -exec cp {} assets/ \;
          cp source/scripts/install.sh source/scripts/install.ps1 assets/
          (cd assets && sha256sum -- * > SHA256SUMS)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" =~ -(alpha|beta|rc)\.[0-9]+$ ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" assets/* --verify-tag --draft "${prerelease[@]}" \
            --title "$RELEASE_TAG" --generate-notes
