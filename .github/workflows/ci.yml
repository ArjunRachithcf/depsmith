name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: j178/prek-action@v3.0.0
        with:
          prek-version: 0.5.4
  rust:
    strategy:
      fail-fast: false
      matrix:
        # Release executables are named after their target triple.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build API docs (broken links fail)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo build --release --locked -p depsmith
      - run: python -c "import shutil; shutil.copyfile('LICENSE', 'target/release/LICENSE')"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            target/release/depsmith
            target/release/depsmith.exe
            target/release/LICENSE
          if-no-files-found: error
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist -i ${{ runner.os == 'Linux' && 'python3.10' || 'python' }}
          manylinux: auto
      - name: Install the built wheel
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', *glob.glob('dist/*.whl')])"
      - run: python -m unittest discover -s tests/python -v
      - run: depsmith --version
      - run: python scripts/check-distributions.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
  docs-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Guard tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Documentation bot commits change only documentation
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          for commit in $(git log --format=%H --grep='^Docs-only: true$' "$BASE..HEAD"); do
            echo "Checking $commit"
            python scripts/check-docs-only.py "$commit^" "$commit"
          done
  docs-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - name: Generated wiki reference is current and wiki links resolve
        run: |
          python -m pip install .
          python scripts/gen-reference.py --check
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --workspace --locked
  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Package and verify both crates as crates.io would
        run: cargo publish --workspace --dry-run --locked
  # Linux runs these in docs-guard's script tests; here macOS (BSD tools) and
  # Windows (install.ps1 with bsdtar).
  install-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: install.sh and install.ps1 against a local release
        run: python -m unittest discover -s scripts/tests -p "test_install_scripts.py" -v
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install from the sdist
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', *glob.glob('dist/*.tar.gz')])"
      - run: python -m unittest discover -s tests/python -v
      - run: depsmith --version
      - run: python scripts/check-distributions.py dist
  conda:
    # The conda-forge recipe, built with this commit's sdist in place of the
    # published one.
    needs: sdist
    runs-on: ubuntu-latest
    env:
      RATTLER_BUILD_VERSION: 0.76.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Point the recipe at the local sdist
        run: |
          python3 - <<'PY'
          import glob, hashlib, pathlib, re, shutil
          sdists = glob.glob('dist/depsmith-*.tar.gz')
          if len(sdists) != 1:
              raise SystemExit(f'Expected one depsmith sdist in dist/, found {sdists}')
          (sdist,) = sdists
          version = pathlib.Path(sdist).name.removeprefix('depsmith-').removesuffix('.tar.gz')
          sha256 = hashlib.sha256(pathlib.Path(sdist).read_bytes()).hexdigest()
          shutil.copytree('recipes/depsmith', 'conda-recipe')
          recipe = pathlib.Path('conda-recipe/recipe.yaml')
          text = recipe.read_text()
          text, versions = re.subn(r'(?m)^  version: ".*"$', f'  version: "{version}"', text)
          text, sources = re.subn(
              r'(?m)^  url: .*\n  sha256: .*$',
              f'  url: file://{pathlib.Path(sdist).resolve()}\n  sha256: {sha256}',
              text,
          )
          if (versions, sources) != (1, 1):
              raise SystemExit('recipe.yaml no longer has one context version and one url source')
          recipe.write_text(text)
          PY
      - name: Resolve the pinned Pixi
        run: echo "PIXI_VERSION=v$(jq -r .pixi .github/tool-versions.json)" >> "$GITHUB_ENV"
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          run-install: false
      - name: Build and test the conda package
        run: >-
          pixi exec --spec "rattler-build==$RATTLER_BUILD_VERSION" rattler-build build
          --recipe conda-recipe/recipe.yaml -m .github/conda-variants.yaml
          -c conda-forge --output-dir conda-dist
      - uses: actions/upload-artifact@v4
        with:
          name: conda-linux-64
          path: conda-dist/linux-64/*.conda
          if-no-files-found: error
