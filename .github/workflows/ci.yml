name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: j178/prek-action@v3.0.0
        with:
          prek-version: 0.5.4
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo build --release --locked -p depsmith-cli
      - run: python -c "import shutil; shutil.copyfile('LICENSE', 'target/release/LICENSE')"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: |
            target/release/depsmith
            target/release/depsmith.exe
            target/release/LICENSE
          if-no-files-found: error
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist -i ${{ runner.os == 'Linux' && 'python3.10' || 'python' }}
          manylinux: auto
      - name: Install the built wheel
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', *glob.glob('dist/*.whl')])"
      - run: python -m unittest discover -s tests/python -v
      - run: depsmith --version
      - run: python scripts/check-distributions.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --workspace --locked
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install from the sdist
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', *glob.glob('dist/*.tar.gz')])"
      - run: python -m unittest discover -s tests/python -v
      - run: depsmith --version
      - run: python scripts/check-distributions.py dist
  conda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-build-version: '*'
          python-version: '3.12'
      - name: Build and install-test conda package
        shell: bash -el {0}
        run: conda build --override-channels -c conda-forge --no-anaconda-upload --output-folder conda-dist recipes/depsmith
      - uses: actions/upload-artifact@v4
        with:
          name: conda-linux-64
          path: conda-dist/linux-64/*.conda
          if-no-files-found: error
